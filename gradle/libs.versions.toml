# WuZhuFolio 版本目录（T0.1 唯一版本真源）
# 选型依据：docs/tech/adr/ADR-001（技术栈）、ADR-002（存储/加密）、ADR-003（行情 HTTP）、ADR-006（构建分发）
# 许可证清单与 AGPL-3.0 兼容核验：docs/tech/dependency-licenses.md
[versions]
kotlin = "2.4.10"
compose-plugin = "1.12.0"
# Material 3 独立版本线（与 compose 插件版本不同步；1.9.0 = 当前解析版本）
compose-material3 = "1.9.0"
coroutines = "1.11.0"
serialization = "1.11.0"
exposed = "1.5.0"
sqlite-jdbc-crypt = "3.53.4.0"   # Willena fork（org.sqlite.mc，SQLCipher 4 兼容），M1 T1.1 锁版实证（三平台）
ktor = "3.5.2"
okhttp = "5.5.0"
koin = "4.2.2"
bouncycastle = "1.85.2"
javakeyring = "1.0.4"
logback = "1.6.3"
slf4j = "2.0.17"
lifecycle = "2.11.0"
detekt = "1.23.8"
# Compose Hot Reload（ADR-007 §2.4）：开发期 UI 热重载；版本与 CMP 1.12 捆绑版本一致（1.2.0），
# **只影响开发任务（:app:hotRun），不进发布产物**
compose-hot-reload = "1.2.0"
junit4 = "4.13.2"

[libraries]
# D-Bus（D39：Linux 原生托盘 SNI + dbusmenu；版本与 java-keyring 传递依赖一致 4.2.1）
dbus-java-core = { group = "com.github.hypfvieh", name = "dbus-java-core", version = "4.2.1" }
dbus-java-transport = { group = "com.github.hypfvieh", name = "dbus-java-transport-native-unixsocket", version = "4.2.1" }

# Kotlinx
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# 存储（ADR-002）：Exposed ORM + Willena SQLCipher 驱动（M1 T1.1 起，raw-key 注入，三平台锁版）
exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposed" }
exposed-dao = { group = "org.jetbrains.exposed", name = "exposed-dao", version.ref = "exposed" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposed" }
sqlite-jdbc-crypt = { group = "io.github.willena", name = "sqlite-jdbc", version.ref = "sqlite-jdbc-crypt" }   # M1 T1.1 起取代 xerial 明文驱动（同源 fork，整库加密）
# 加密与钥匙串（ADR-002），M1 起用：Argon2id 走 bcprov 纯 JVM（argon2-jvm 原生绑定未采用，见模块记录 T1.3）
bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
java-keyring = { group = "com.github.javakeyring", name = "java-keyring", version.ref = "javakeyring" }
# 行情/交易所 HTTP（ADR-003/004），M5/M6 起用：Ktor client + OkHttp 引擎（系统代理 ProxySelector）
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# DI 与架构（ADR-001）
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Compose Material 3（T14.1 起为界面唯一真源；直接声明坐标以消除 compose.material3 访问器的 Gradle 弃用告警）
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "compose-material3" }
# Compose UI 测试（JUnit4 运行器；直接声明坐标以消除 compose.uiTestJUnit4 访问器的 Gradle 弃用告警）
compose-ui-test-junit4 = { group = "org.jetbrains.compose.ui", name = "ui-test-junit4", version.ref = "compose-plugin" }
# 日志（PRD §6 脱敏/轮转，M0 hello 链路起用）
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
# 测试
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
compose-hot-reload = { id = "org.jetbrains.compose.hot-reload", version.ref = "compose-hot-reload" }
