# WuZhuFolio CI（T0.2 + M13 T13.2，ADR-006 §3）
# 两个 job：
#   1. build   三平台矩阵：test（JUnit5 + Compose UI 测试）+ 测试报告归档 + detekt + uber jar 冒烟
#   2. package 三平台原生产物（jpackage：msi/exe · dmg/pkg · deb/rpm + AppImage）；push main 或手动触发
# 签名/公证：凭据经 GitHub Secrets 注入（ADR-006 §2），**未配置时相关步骤自动跳过**并产出未签名产物
# （内部验收口径）；正式发布签名/公证在 P7 用发布凭据执行。
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # M13：允许在特性分支上手动触发（打包链路验证不需要先合入 main）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle（含 wrapper 校验与缓存）
        uses: gradle/actions/setup-gradle@v5

      - name: Test（JUnit5 + Compose UI 测试，离屏渲染）
        shell: bash
        run: ./gradlew test --console=plain --stacktrace

      - name: 上传测试报告（M13：4 项钥匙串真实后端用例在 win/mac 的执行结果可逐项核验）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: '*/build/test-results/test/*.xml'
          retention-days: 14
          if-no-files-found: warn

      - name: detekt 静态检查
        shell: bash
        run: ./gradlew detekt --console=plain

      - name: 打包冒烟（uber jar，纯 Gradle）
        shell: bash
        run: ./gradlew :app:packageUberJarForCurrentOS --console=plain

      - name: 上传 uber jar（冒烟产物，7 天）
        uses: actions/upload-artifact@v6
        with:
          name: wuzhufolio-${{ matrix.os }}-uberjar
          path: app/build/compose/jars/*.jar
          retention-days: 7
          if-no-files-found: warn

  package:
    name: package-${{ matrix.os }}
    needs: build
    # PR 只跑测试；原生打包在 push main / 手动触发时执行（避免 PR 消耗三平台打包时间）
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Gradle 侧签名/公证凭据（app/build.gradle.kts → signingSecret()；未配置 = 不签名）
      WUZHUFOLIO_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      WUZHUFOLIO_MACOS_SIGNING_KEYCHAIN: ${{ secrets.MACOS_SIGNING_KEYCHAIN }}
      WUZHUFOLIO_MACOS_NOTARIZATION_APPLEID: ${{ secrets.MACOS_NOTARIZATION_APPLEID }}
      WUZHUFOLIO_MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
      WUZHUFOLIO_MACOS_NOTARIZATION_TEAMID: ${{ secrets.MACOS_NOTARIZATION_TEAMID }}
      # CI 侧证书导入（仅用于把 Secrets 里的证书装进 runner 钥匙串/证书存储）
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      WIN_CERT_P12: ${{ secrets.WIN_CERT_P12 }}
      WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 安装 Linux 打包依赖（rpm：jpackage packageRpm 需要 rpmbuild）
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: 导入 macOS 签名证书（仅配置证书时）
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/wuzhufolio-signing.p12"
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"
          KEYCHAIN="$RUNNER_TEMP/wuzhufolio.keychain-db"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT_PATH"

      - name: 原生打包（jpackage：当前平台全部目标格式）
        shell: bash
        # Linux = deb + rpm；Windows = msi + exe（WiX 由插件自动下载）；macOS = dmg + pkg
        # （签名/公证仅在注入凭据时启用）
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-Pcompose.desktop.application.downloadWix=true"
          fi
          ./gradlew :app:packageDistributionForCurrentOS $EXTRA --console=plain --stacktrace

      - name: 打包失败诊断（jpackage 输出与错误日志）
        if: failure()
        shell: bash
        run: |
          echo "=== jpackage logs ==="
          find app/build/compose/logs -type f -name '*.txt' -print -exec cat {} \; || true

      - name: AppImage（Linux 追加，ADR-006 §1：appimagetool 包 jpackage app-image）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./gradlew :app:createDistributable --console=plain
          ./scripts/package-appimage.sh

      - name: 代码签名（Windows，仅配置证书时）
        if: runner.os == 'Windows' && env.WIN_CERT_P12 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "wuzhufolio-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_P12))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe 未找到（Windows SDK 缺失）" }
          $targets = Get-ChildItem -Path app/build/compose/binaries/main -Recurse -Include *.msi, *.exe
          foreach ($t in $targets) {
            Write-Host "signing $($t.FullName)"
            & $signtool sign /f $pfx /p $env:WIN_CERT_PASSWORD /fd sha256 `
              /tr http://timestamp.digicert.com /td sha256 $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($t.Name)" }
          }
          Remove-Item $pfx -Force

      - name: 产物清单与校验和
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/compose/binaries/main
          find . -maxdepth 2 -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.pkg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec ls -l {} \; -exec sha256sum {} \; | tee "$RUNNER_TEMP/artifacts.txt"

      - name: 上传原生产物（14 天）
        uses: actions/upload-artifact@v6
        with:
          name: wuzhufolio-${{ matrix.os }}-native
          path: |
            app/build/compose/binaries/main/msi/*.msi
            app/build/compose/binaries/main/exe/*.exe
            app/build/compose/binaries/main/dmg/*.dmg
            app/build/compose/binaries/main/pkg/*.pkg
            app/build/compose/binaries/main/deb/*.deb
            app/build/compose/binaries/main/rpm/*.rpm
            app/build/compose/binaries/main/appimage/*.AppImage
            app/build/compose/binaries/main/appimage/*.sha256
          retention-days: 14
          if-no-files-found: warn

      - name: 上传产物清单（含 SHA256 与签名状态）
        uses: actions/upload-artifact@v6
        with:
          name: wuzhufolio-${{ matrix.os }}-artifacts-manifest
          path: ${{ runner.temp }}/artifacts.txt
          retention-days: 14
          if-no-files-found: warn

      # DEF-42 预防项（建议 C0：质量工程补强，不改产品语义/产物口径）：
      # 「产物从未被启动过就交付到人工门」是 DEF-42（Windows 安装版 Failed to launch JVM）的直接成因。
      # 本步骤在**产物上传之后**实跑打包产物本身（jpackage app-image，含捆绑私有运行时）：
      #   变体 1 = 常规路径（默认 TEMP）；变体 2 = **非 ASCII 路径**（复现「中文用户名/中文安装目录」场景，
      #            用以实证 Windows 启动器的路径编码敏感性）。
      # 观察期口径：continue-on-error（不阻断作业与产物上传），日志串 PACKAGED_LAUNCH_SMOKE[_CJK]=PASS/FAIL；
      # 连续数轮稳定后可按人工拍板改为阻断式。
      - name: 打包版启动冒烟（Windows app-image 实跑 + 非 ASCII 路径变体 · 观察期非阻断）
        if: runner.os == 'Windows' && always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $appImage = 'app/build/compose/binaries/main/app/WuZhuFolio'
          if (-not (Test-Path "$appImage/WuZhuFolio.exe")) {
            Write-Host 'app-image 缺失，先构建（createDistributable 不需要 WiX）'
            & .\gradlew.bat :app:createDistributable --console=plain
          }
          if (-not (Test-Path "$appImage/WuZhuFolio.exe")) {
            Write-Host '::warning::PACKAGED_LAUNCH_SMOKE=SKIP  app-image 未产出'
            exit 0
          }
          $env:JAVA_TOOL_OPTIONS = '-Dskiko.renderApi=SOFTWARE_FAST'

          function Invoke-LaunchProbe {
            param([string]$Label, [string]$ExePath, [int]$TimeoutSeconds = 90)
            $dataDir = Join-Path $env:RUNNER_TEMP ('wzf-smoke-' + $Label + '-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
            $env:WUZHUFOLIO_DATA_DIR = $dataDir
            $full = (Resolve-Path -LiteralPath $ExePath).Path
            Write-Host "== [$Label] 启动：$full"
            Write-Host "== [$Label] 数据目录：$dataDir"
            $proc = Start-Process -FilePath $full -WorkingDirectory (Split-Path -Parent $full) -PassThru
            $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              $log = Get-ChildItem (Join-Path $dataDir 'logs') -Filter '*.log' -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($log -and (Select-String -LiteralPath $log.FullName -Pattern 'bootstrap ok' -Quiet)) {
                Write-Host "== [$Label] bootstrap ok："
                Select-String -LiteralPath $log.FullName -Pattern 'bootstrap ok' | Select-Object -Last 1 |
                  ForEach-Object { Write-Host ('   ' + $_.Line) }
                if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
                return $true
              }
              if ($proc.HasExited) {
                Write-Host "== [$Label] 进程已退出（exitCode=$($proc.ExitCode)），未写出 bootstrap ok"
                break
              }
            }
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            $log = Get-ChildItem (Join-Path $dataDir 'logs') -Filter '*.log' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($log) { Write-Host "== [$Label] 应用日志尾部："; Get-Content -LiteralPath $log.FullName -Tail 30 }
            Write-Host "== [$Label] 目录内容："
            Get-ChildItem (Split-Path -Parent $full) | Select-Object -First 20 | Format-Table -AutoSize | Out-String | Write-Host
            return $false
          }

          $okAscii = Invoke-LaunchProbe -Label 'ascii' -ExePath "$appImage/WuZhuFolio.exe"
          if ($okAscii) { Write-Host 'PACKAGED_LAUNCH_SMOKE=PASS' }
          else { Write-Host 'PACKAGED_LAUNCH_SMOKE=FAIL（观察期非阻断，但请核验打包版可启动性）' }

          # 变体 2/3：整目录复制到含非 ASCII 的路径再跑，用于区分两类假设：
          #   latin1 = 该字符在系统 ANSI 代码页（CI runner = CP1252）**可表示**（é）
          #   cjk    = 该字符在系统 ANSI 代码页**不可表示**（中文）
          # 若 latin1 PASS 而 cjk FAIL → 机制是「路径经 ANSI 代码页转换」；若两者皆 FAIL → 任何非 ASCII 都挂。
          $variants = @(
            @{ Label = 'latin1'; Dir = 'wzf-café-path' },
            @{ Label = 'cjk';    Dir = 'wzf-非ASCII路径' }
          )
          foreach ($v in $variants) {
            $root = Join-Path $env:RUNNER_TEMP $v.Dir
            New-Item -ItemType Directory -Path $root -Force | Out-Null
            $dest = Join-Path $root 'WuZhuFolio'
            if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
            Copy-Item -LiteralPath $appImage -Destination $dest -Recurse -Force
            $probeOk = Invoke-LaunchProbe -Label $v.Label -ExePath (Join-Path $dest 'WuZhuFolio.exe')
            $verdict = 'FAIL'
            if ($probeOk) { $verdict = 'PASS' }
            Write-Host "PACKAGED_LAUNCH_SMOKE_$($v.Label.ToUpper())=$verdict（路径含非 ASCII：$($v.Dir)）"
          }

          if (-not $okAscii) {
            Write-Host '::warning::打包版启动冒烟失败：Windows app-image 在常规路径下未能写出 bootstrap ok（DEF-42 预防项）'
            exit 3
          }
