# WuZhuFolio CI（T0.2 + M13 T13.2，ADR-006 §3）
# 两个 job：
#   1. build   三平台矩阵：test（JUnit5 + Compose UI 测试）+ 测试报告归档 + detekt + uber jar 冒烟
#   2. package 三平台原生产物（jpackage：msi/exe · dmg/pkg · deb/rpm + AppImage）；push main 或手动触发
# 签名/公证：凭据经 GitHub Secrets 注入（ADR-006 §2），**未配置时相关步骤自动跳过**并产出未签名产物
# （内部验收口径）；正式发布签名/公证在 P7 用发布凭据执行。
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # M13：允许在特性分支上手动触发（打包链路验证不需要先合入 main）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle（含 wrapper 校验与缓存）
        uses: gradle/actions/setup-gradle@v5

      - name: Test（JUnit5 + Compose UI 测试，离屏渲染）
        shell: bash
        run: ./gradlew test --console=plain --stacktrace

      - name: 上传测试报告（M13：4 项钥匙串真实后端用例在 win/mac 的执行结果可逐项核验）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: '*/build/test-results/test/*.xml'
          retention-days: 14
          if-no-files-found: warn

      - name: detekt 静态检查
        shell: bash
        run: ./gradlew detekt --console=plain

      - name: 打包冒烟（uber jar，纯 Gradle）
        shell: bash
        run: ./gradlew :app:packageUberJarForCurrentOS --console=plain

      - name: 上传 uber jar（冒烟产物，7 天）
        uses: actions/upload-artifact@v6
        with:
          name: wuzhufolio-${{ matrix.os }}-uberjar
          path: app/build/compose/jars/*.jar
          retention-days: 7
          if-no-files-found: warn

  package:
    name: package-${{ matrix.os }}
    needs: build
    # PR 只跑测试；原生打包在 push main / 手动触发时执行（避免 PR 消耗三平台打包时间）
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Gradle 侧签名/公证凭据（app/build.gradle.kts → signingSecret()；未配置 = 不签名）
      WUZHUFOLIO_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      WUZHUFOLIO_MACOS_SIGNING_KEYCHAIN: ${{ secrets.MACOS_SIGNING_KEYCHAIN }}
      WUZHUFOLIO_MACOS_NOTARIZATION_APPLEID: ${{ secrets.MACOS_NOTARIZATION_APPLEID }}
      WUZHUFOLIO_MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
      WUZHUFOLIO_MACOS_NOTARIZATION_TEAMID: ${{ secrets.MACOS_NOTARIZATION_TEAMID }}
      # CI 侧证书导入（仅用于把 Secrets 里的证书装进 runner 钥匙串/证书存储）
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      WIN_CERT_P12: ${{ secrets.WIN_CERT_P12 }}
      WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 安装 Linux 打包依赖（rpm：jpackage packageRpm 需要 rpmbuild）
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: 导入 macOS 签名证书（仅配置证书时）
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/wuzhufolio-signing.p12"
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"
          KEYCHAIN="$RUNNER_TEMP/wuzhufolio.keychain-db"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT_PATH"

      - name: 原生打包（jpackage：当前平台全部目标格式）
        shell: bash
        # Linux = deb + rpm；Windows = msi + exe（WiX 由插件自动下载）；macOS = dmg + pkg
        # （签名/公证仅在注入凭据时启用）
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-Pcompose.desktop.application.downloadWix=true"
          fi
          ./gradlew :app:packageDistributionForCurrentOS $EXTRA --console=plain --stacktrace

      - name: 打包失败诊断（jpackage 输出与错误日志）
        if: failure()
        shell: bash
        run: |
          echo "=== jpackage logs ==="
          find app/build/compose/logs -type f -name '*.txt' -print -exec cat {} \; || true

      - name: AppImage（Linux 追加，ADR-006 §1：appimagetool 包 jpackage app-image）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./gradlew :app:createDistributable --console=plain
          ./scripts/package-appimage.sh

      # Windows 的 packageDistributionForCurrentOS **不保留** app-image（CI 实测：便携版步骤取不到 exe），
      # 而便携版打包与启动冒烟都要用它。故在**签名之前**统一确保 app-image 存在：
      # 这样签名步骤（递归签 msi/exe）也能覆盖 app-image 内的启动器 exe，便携包内即为已签名二进制。
      - name: 确保 app-image 存在（签名前 · 便携版与启动冒烟共用）
        shell: bash
        run: |
          set -uo pipefail
          case "$RUNNER_OS" in
            Windows) probe="app/build/compose/binaries/main/app/WuZhuFolio/WuZhuFolio.exe" ;;
            Linux)   probe="app/build/compose/binaries/main/app/WuZhuFolio/bin/WuZhuFolio" ;;
            macOS)   probe="app/build/compose/binaries/main/app/WuZhuFolio.app/Contents/MacOS/WuZhuFolio" ;;
            *)       probe="" ;;
          esac
          if [ -n "$probe" ] && [ -e "$probe" ]; then
            echo "app-image 已存在：$probe"
            exit 0
          fi
          echo "app-image 缺失，执行 :app:createDistributable"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./gradlew.bat :app:createDistributable --console=plain
          else
            ./gradlew :app:createDistributable --console=plain
          fi
          if [ -n "$probe" ] && [ -e "$probe" ]; then echo "OK：$probe"; else echo "::warning::app-image 仍未产出（$probe）"; fi

      - name: 代码签名（Windows，仅配置证书时）
        if: runner.os == 'Windows' && env.WIN_CERT_P12 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "wuzhufolio-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_P12))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe 未找到（Windows SDK 缺失）" }
          $targets = Get-ChildItem -Path app/build/compose/binaries/main -Recurse -Include *.msi, *.exe
          foreach ($t in $targets) {
            Write-Host "signing $($t.FullName)"
            & $signtool sign /f $pfx /p $env:WIN_CERT_PASSWORD /fd sha256 `
              /tr http://timestamp.digicert.com /td sha256 $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($t.Name)" }
          }
          Remove-Item $pfx -Force

      # DEF-42 / D34：便携版产物（app-image 压缩包）。
      # 用途：① 无管理员权限或需要自定义安装位置的用户；② 用户名/安装路径非 ASCII 时的兜底
      # （jpackage 的 Windows 启动器在路径含「系统 ANSI 代码页无法表示的字符」时无法启动，CI 已实证）。
      # 放在签名步骤**之后**，确保包内二进制为已签名版本。
      - name: 便携版产物（Windows：app-image → zip · D34）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = 'app/build/compose/binaries/main/app/WuZhuFolio'
          $out = 'app/build/compose/binaries/main/portable'
          if (-not (Test-Path "$src/WuZhuFolio.exe")) { Write-Host '::warning::app-image 缺失，跳过便携版打包'; exit 0 }
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -LiteralPath 'LICENSE' -Destination "$src/LICENSE.txt" -Force
          $readme = @(
            'WuZhuFolio 便携版（portable）',
            '',
            '1) 请先解压到「纯英文（ASCII）路径」再运行，例如 D:\WuZhuFolio',
            '   Extract to an ASCII-only path first, e.g. D:\WuZhuFolio.',
            '2) 双击 WuZhuFolio.exe 运行（已自带私有 JRE，无需预装 Java）',
            '3) 数据存放在用户目录（~/.wuzhufolio），不写入本目录；卸载 = 直接删除本目录',
            ''
          ) -join [Environment]::NewLine
          Set-Content -LiteralPath "$src/README-portable.txt" -Value $readme -Encoding UTF8
          $zip = Join-Path $out 'WuZhuFolio-portable-windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $src -DestinationPath $zip -Force
          Get-Item $zip | ForEach-Object { Write-Host ('便携版：{0}（{1:N1} MB）' -f $_.Name, ($_.Length / 1MB)) }

      - name: 便携版产物（Linux：app-image → tar.gz · D34）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          src=app/build/compose/binaries/main/app/WuZhuFolio
          out=app/build/compose/binaries/main/portable
          if [ ! -x "$src/bin/WuZhuFolio" ]; then echo '::warning::app-image 缺失，跳过便携版打包'; exit 0; fi
          mkdir -p "$out"
          cp LICENSE "$src/LICENSE.txt"
          printf '%s\n' 'WuZhuFolio 便携版（portable）' '' \
            '1) 解压到任意目录后运行 bin/WuZhuFolio（已自带私有 JRE，无需预装 Java）' \
            '2) 数据存放在 ~/.wuzhufolio，不写入本目录；卸载 = 直接删除本目录' > "$src/README-portable.txt"
          tar -czf "$out/WuZhuFolio-portable-linux-x64.tar.gz" -C app/build/compose/binaries/main/app WuZhuFolio
          ls -lh "$out"

      - name: 便携版产物（macOS：.app → zip · D34）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=app/build/compose/binaries/main/app/WuZhuFolio.app
          out=app/build/compose/binaries/main/portable
          if [ ! -d "$app" ]; then echo '::warning::app bundle 缺失，跳过便携版打包'; exit 0; fi
          mkdir -p "$out"
          arch=$(uname -m)
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$out/WuZhuFolio-portable-macos-$arch.zip"
          ls -lh "$out"

      - name: 产物清单与校验和
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/compose/binaries/main
          find . -maxdepth 2 -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.pkg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*-portable-*.zip' -o -name '*-portable-*.tar.gz' \) \
            -exec ls -l {} \; -exec sha256sum {} \; | tee "$RUNNER_TEMP/artifacts.txt"

      - name: 上传原生产物（14 天）
        uses: actions/upload-artifact@v6
        with:
          name: wuzhufolio-${{ matrix.os }}-native
          path: |
            app/build/compose/binaries/main/msi/*.msi
            app/build/compose/binaries/main/exe/*.exe
            app/build/compose/binaries/main/dmg/*.dmg
            app/build/compose/binaries/main/pkg/*.pkg
            app/build/compose/binaries/main/deb/*.deb
            app/build/compose/binaries/main/rpm/*.rpm
            app/build/compose/binaries/main/appimage/*.AppImage
            app/build/compose/binaries/main/appimage/*.sha256
            app/build/compose/binaries/main/portable/*.zip
            app/build/compose/binaries/main/portable/*.tar.gz
          retention-days: 14
          if-no-files-found: warn

      - name: 上传产物清单（含 SHA256 与签名状态）
        uses: actions/upload-artifact@v6
        with:
          name: wuzhufolio-${{ matrix.os }}-artifacts-manifest
          path: ${{ runner.temp }}/artifacts.txt
          retention-days: 14
          if-no-files-found: warn

      # DEF-42 预防项（建议 C0：质量工程补强，不改产品语义/产物口径）：
      # 「产物从未被启动过就交付到人工门」是 DEF-42（Windows 安装版 Failed to launch JVM）的直接成因。
      # 本步骤在**产物上传之后**实跑打包产物本身（jpackage app-image，含捆绑私有运行时）：
      #   变体 1 = 常规路径（默认 TEMP）；变体 2 = **非 ASCII 路径**（复现「中文用户名/中文安装目录」场景，
      #            用以实证 Windows 启动器的路径编码敏感性）。
      # 观察期口径：continue-on-error（不阻断作业与产物上传），日志串 PACKAGED_LAUNCH_SMOKE[_CJK]=PASS/FAIL；
      # 连续数轮稳定后可按人工拍板改为阻断式。
      - name: 打包版启动冒烟（Windows app-image 实跑 + 非 ASCII 路径变体 · 观察期非阻断）
        if: runner.os == 'Windows' && always()
        continue-on-error: true
        shell: pwsh
        run: |
          $appImage = 'app/build/compose/binaries/main/app/WuZhuFolio'
          if (-not (Test-Path "$appImage/WuZhuFolio.exe")) {
            Write-Host 'app-image 缺失，先构建（createDistributable 不需要 WiX）'
            & .\gradlew.bat :app:createDistributable --console=plain
          }
          if (-not (Test-Path "$appImage/WuZhuFolio.exe")) {
            Write-Host '::warning::PACKAGED_LAUNCH_SMOKE=SKIP  app-image 未产出'
            exit 0
          }
          # 探针实现见 scripts/probe-packaged-launch.ps1（同一脚本可供人工在本机复跑）
          & pwsh -File scripts/probe-packaged-launch.ps1 -Label 'ascii' -ExePath "$appImage/WuZhuFolio.exe"
          $asciiOk = ($LASTEXITCODE -eq 0)
          if ($asciiOk) { Write-Host 'PACKAGED_LAUNCH_SMOKE=PASS' } else { Write-Host 'PACKAGED_LAUNCH_SMOKE=FAIL（观察期非阻断，但请核验打包版可启动性）' }

          # 变体 2/3：整目录复制到含非 ASCII 的路径再跑，用于区分两类假设：
          #   latin1 = 该字符在系统 ANSI 代码页（CI runner = CP1252）**可表示**（é）→ 实测 PASS
          #   cjk    = 该字符在系统 ANSI 代码页**不可表示**（中文）→ 实测 FAIL（exitCode=2、无日志）
          # 即：启动器只在「路径字符无法用系统 ANSI 代码页表示」时崩溃（DEF-42 根因已实证）。
          $variants = @(
            @{ Label = 'latin1'; Dir = 'wzf-café-path' },
            @{ Label = 'cjk';    Dir = 'wzf-非ASCII路径' }
          )
          foreach ($v in $variants) {
            $root = Join-Path $env:RUNNER_TEMP $v.Dir
            New-Item -ItemType Directory -Path $root -Force | Out-Null
            $dest = Join-Path $root 'WuZhuFolio'
            if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
            Copy-Item -LiteralPath $appImage -Destination $dest -Recurse -Force
            & pwsh -File scripts/probe-packaged-launch.ps1 -Label $v.Label -ExePath (Join-Path $dest 'WuZhuFolio.exe')
            $verdict = 'FAIL'
            if ($LASTEXITCODE -eq 0) { $verdict = 'PASS' }
            Write-Host "PACKAGED_LAUNCH_SMOKE_$($v.Label.ToUpper())=$verdict（路径含非 ASCII：$($v.Dir)）"
          }
          if (-not $asciiOk) {
            Write-Host '::warning::打包版启动冒烟失败：Windows app-image 在常规路径下未能写出 bootstrap ok（DEF-42 预防项）'
            exit 3
          }

      # DEF-42 / D34 验收：**安装版**布局实跑（app-image 冒烟覆盖不到安装后的目录与安装范围）。
      # 静默安装 MSI → 断言 exe 落在 C:\Program Files\WuZhuFolio（per-machine、纯 ASCII）→ 实跑 → 卸载。
      - name: 安装版实跑冒烟（MSI 静默安装 → 跑已安装 exe → 卸载 · 观察期非阻断）
        if: runner.os == 'Windows' && always()
        continue-on-error: true
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'app/build/compose/binaries/main/msi/*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { Write-Host '::warning::INSTALLED_LAUNCH_SMOKE=SKIP 未产出 msi'; exit 0 }
          $target = 'C:\Program Files\WuZhuFolio\WuZhuFolio.exe'
          Write-Host "MSI: $($msi.FullName)"
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$($msi.FullName)`"", '/qn', '/norestart') -Wait -PassThru
          Write-Host "msiexec /i exitCode=$($p.ExitCode)"
          $ok = $false
          if (Test-Path -LiteralPath $target) {
            Write-Host '安装目录 = C:\Program Files\WuZhuFolio（per-machine，纯 ASCII —— D34 口径）'
            & pwsh -File scripts/probe-packaged-launch.ps1 -Label 'installed' -ExePath $target
            $ok = ($LASTEXITCODE -eq 0)
            Write-Host "INSTALLED_LAUNCH_SMOKE=$ok"
          } else {
            Write-Host "::warning::未在 $target 找到已安装的 exe，列出候选目录："
            Get-ChildItem 'C:\Program Files' -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like '*WuZhu*' } | ForEach-Object { Write-Host $_.FullName }
            Get-ChildItem $env:LOCALAPPDATA -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like '*WuZhu*' } | ForEach-Object { Write-Host $_.FullName }
            Write-Host 'INSTALLED_LAUNCH_SMOKE=FAIL'
          }
          $p2 = Start-Process msiexec.exe -ArgumentList @('/x', "`"$($msi.FullName)`"", '/qn', '/norestart') -Wait -PassThru
          Write-Host "msiexec /x exitCode=$($p2.ExitCode)"
          if (-not $ok) { Write-Host '::warning::安装版启动冒烟失败（DEF-42 / D34 预防项，观察期非阻断）' }
          exit 0

  # DEF-42 实验（按需触发）：用 **JDK 21** 打包，检验 jpackage 启动器是否修掉「非 ASCII 安装路径」崩溃。
  # 仅在提交信息含 [probe-jdk21] 时运行（避免常态消耗 CI 时间）；结论用于决定是否提升打包 JDK。
  probe-jdk21-nonascii:
    name: probe-jdk21-nonascii
    if: contains(github.event.head_commit.message, '[probe-jdk21]')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK (Temurin 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 用 JDK 21 产出 app-image 并在非 ASCII 路径实跑
        shell: pwsh
        run: |
          java -version
          & .\gradlew.bat :app:createDistributable --console=plain --stacktrace
          $appImage = 'app/build/compose/binaries/main/app/WuZhuFolio'
          if (-not (Test-Path "$appImage/WuZhuFolio.exe")) { Write-Host '::error::JDK21 app-image 未产出'; exit 4 }
          & pwsh -File scripts/probe-packaged-launch.ps1 -Label 'jdk21-ascii' -ExePath "$appImage/WuZhuFolio.exe"
          $asciiOk = ($LASTEXITCODE -eq 0)
          $root = Join-Path $env:RUNNER_TEMP 'wzf-jdk21-非ASCII路径'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $dest = Join-Path $root 'WuZhuFolio'
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          Copy-Item -LiteralPath $appImage -Destination $dest -Recurse -Force
          & pwsh -File scripts/probe-packaged-launch.ps1 -Label 'jdk21-cjk' -ExePath (Join-Path $dest 'WuZhuFolio.exe')
          $cjkOk = ($LASTEXITCODE -eq 0)
          Write-Host "JDK21_PROBE ascii=$asciiOk cjk=$cjkOk"
          Write-Host '（ascii=True 且 cjk=True ⇒ 升级打包 JDK 可修掉非 ASCII 路径崩溃；cjk=False ⇒ 仍需 ASCII 路径/便携版）'
          if (-not $cjkOk) {
            Write-Host '::warning::JDK21 实验结论：升级打包 JDK 不能修掉「非 ASCII 安装路径」崩溃（仍需路径/产物结构方案）'
          }
          exit 0
  # DEF-42 第二轮取证（按需触发）：产出「控制台版」调试产物 —— GUI 启动器只弹无细节的
  # `Failed to launch JVM`，控制台版启动器会把 JVM 初始化失败的真实原因打到控制台。
  # 仅在提交信息含 [probe-console] 时运行。
  console-debug-windows:
    name: console-debug-windows
    if: contains(github.event.head_commit.message, '[probe-console]')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 产出控制台版 app-image 并打包
        shell: pwsh
        run: |
          & .\gradlew.bat :app:createDistributable -Pwuzhufolio.windowsConsole=true --console=plain --stacktrace
          $src = 'app/build/compose/binaries/main/app/WuZhuFolio'
          if (-not (Test-Path "$src/WuZhuFolio.exe")) { Write-Host '::error::控制台版 app-image 未产出'; exit 4 }
          $out = 'app/build/compose/binaries/main/portable'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $zip = Join-Path $out 'WuZhuFolio-console-debug-windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Copy-Item -LiteralPath 'LICENSE' -Destination "$src/LICENSE.txt" -Force
          Compress-Archive -Path $src -DestinationPath $zip -Force
          Get-Item $zip | ForEach-Object { Write-Host ('控制台调试产物：{0}（{1:N1} MB）' -f $_.Name, ($_.Length / 1MB)) }

      - name: 自检（控制台版能否启动）
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          & pwsh -File scripts/probe-packaged-launch.ps1 -Label 'console-debug' -ExePath 'app/build/compose/binaries/main/app/WuZhuFolio/WuZhuFolio.exe'

      - name: 上传控制台调试产物（14 天）
        uses: actions/upload-artifact@v6
        with:
          name: wuzhufolio-windows-console-debug
          path: app/build/compose/binaries/main/portable/WuZhuFolio-console-debug-windows-x64.zip
          retention-days: 14
          if-no-files-found: warn
