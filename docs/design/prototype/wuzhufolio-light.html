<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WuZhuFolio - 本地加密资产账本（原型 · 主版 · 单一真源 · 内置明暗双主题）</title>
<style>
:root{ --bg:#F6F4EF; --surface:#FFFFFF; --surface2:#EDE9E1; --ink:#1E2622; --ink2:#5C655F; --ink3:#68716A; --accent:#1F5A48; --accent-ink:#F6F4EF; --gain:#17663F; --loss:#A93A37; --warn:#8A6416; --line:#D9D4CA; --hover:rgba(31,90,72,0.06); --sel:rgba(31,90,72,0.10); --shadow:0 1px 2px rgba(30,38,34,0.06),0 8px 24px rgba(30,38,34,0.07); --btn-ghost:#FFFFFF; }
:root[data-theme="dark"]{ --bg:#151A18; --surface:#1D2421; --surface2:#27302C; --ink:#E8EAE6; --ink2:#9AA69F; --ink3:#8A938C; --accent:#D0A85C; --accent-ink:#151A18; --gain:#4CBF82; --loss:#E07873; --warn:#D0A85C; --line:#2E3733; --hover:rgba(208,168,92,0.08); --sel:rgba(208,168,92,0.14); --shadow:0 1px 2px rgba(0,0,0,0.4),0 10px 30px rgba(0,0,0,0.45); --btn-ghost:#1D2421; }
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{ font-family:-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif; color:var(--ink); background:#DDD8CE; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
body[data-theme="dark"]{ background:#0B0E0D; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.window{ position:relative; width:1240px; height:820px; background:var(--bg); border-radius:12px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.28),0 0 0 1px rgba(0,0,0,0.12); display:flex; flex-direction:column; }
.titlebar{ height:40px; background:linear-gradient(to bottom,#ECEAE4,#DBD8D0); display:flex; align-items:center; padding:0 14px; position:relative; user-select:none; flex:0 0 40px; border-bottom:1px solid rgba(0,0,0,0.08); }
body[data-theme="dark"] .titlebar{ background:linear-gradient(to bottom,#2B2B28,#1F1F1C); border-bottom:1px solid rgba(255,255,255,0.08); }
.tlights{ display:flex; gap:8px; }
.tlights i{ width:12px; height:12px; border-radius:50%; border:0.5px solid rgba(0,0,0,0.15); }
.tlights i:nth-child(1){ background:#FF5F57; } .tlights i:nth-child(2){ background:#FEBC2E; } .tlights i:nth-child(3){ background:#28C840; }
.tbtitle{ position:absolute; left:0; right:0; text-align:center; font-size:13px; color:var(--ink2); font-weight:500; pointer-events:none; letter-spacing:0.2px; }
.tbtitle b{ color:var(--ink); font-weight:600; }
.app{ flex:1; display:flex; min-height:0; }
.window.gated .app{ visibility:hidden; }
.gate{ position:absolute; top:40px; left:0; right:0; bottom:0; background:var(--bg); display:none; align-items:center; justify-content:center; z-index:30; overflow:auto; padding:24px; }
.window.gated .gate{ display:flex; }
.side{ width:216px; flex:0 0 216px; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; }
.brand{ padding:18px 18px 14px; }
.brand .logo{ font-family:'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC','Noto Serif SC',serif; font-size:20px; font-weight:600; letter-spacing:-0.3px; color:var(--ink); }
.brand .tag{ font-size:11px; color:var(--ink3); margin-top:2px; letter-spacing:0.4px; }
.nav{ padding:6px 10px; flex:1; }
.nav-item{ display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:7px; cursor:pointer; font-size:13.5px; color:var(--ink2); margin-bottom:2px; transition:background .12s,color .12s; width:100%; text-align:left; background:transparent; border:0; font-family:inherit; }
.nav-item:hover{ background:var(--hover); color:var(--ink); }
.nav-item.active{ background:var(--sel); color:var(--accent); font-weight:600; }
.nav-item .k{ font-family:ui-monospace,'SF Mono',Consolas,monospace; font-size:11px; color:var(--ink3); width:18px; text-align:center; }
.nav-item.active .k{ color:var(--accent); }
.sidefoot{ padding:12px; border-top:1px solid var(--line); }
.acct{ display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; cursor:pointer; width:100%; text-align:left; background:transparent; border:0; font-family:inherit; }
.acct:hover{ background:var(--hover); }
.acct .ava{ width:26px; height:26px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:0 0 26px; }
.acct .nm{ font-size:12.5px; font-weight:600; }
.acct .sub{ font-size:10.5px; color:var(--ink3); }
.main{ flex:1; display:flex; flex-direction:column; min-width:0; }
.topbar{ height:56px; flex:0 0 56px; display:flex; align-items:center; gap:10px; padding:0 20px; border-bottom:1px solid var(--line); }

.topbar .spacer{ flex:1; }
.badge{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink2); background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:5px 11px; }
.badge .dot{ width:7px; height:7px; border-radius:50%; background:var(--gain); }
.badge.warn .dot{ background:var(--warn); }
.badge.off .dot{ background:var(--loss); }
.iconbtn{ width:32px; height:32px; border-radius:7px; border:1px solid var(--line); background:var(--btn-ghost); color:var(--ink2); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; transition:background .12s; font-family:inherit; }
.iconbtn:hover{ background:var(--hover); color:var(--ink); }
.btn{ display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 14px; border-radius:7px; font-size:13px; cursor:pointer; border:1px solid transparent; font-family:inherit; transition:background .12s,border .12s,color .12s; }
.btn.primary{ background:var(--accent); color:var(--accent-ink); } .btn.primary:hover{ filter:brightness(1.07); }
.btn.ghost{ background:var(--btn-ghost); border-color:var(--line); color:var(--ink); } .btn.ghost:hover{ background:var(--hover); }
.btn.danger{ background:transparent; border-color:var(--loss); color:var(--loss); } .btn.danger:hover{ background:rgba(169,58,55,0.08); }
.btn.sm{ height:26px; padding:0 9px; font-size:12px; }
.content{ flex:1; overflow:auto; padding:22px 24px; }
.statusbar{ height:30px; flex:0 0 30px; display:flex; align-items:center; gap:14px; padding:0 20px; font-size:11px; color:var(--ink2); border-top:1px solid var(--line); background:var(--surface); }
.statusbar .sep{ color:var(--ink3); }
.statusbar .ok{ color:var(--gain); } .statusbar .err{ color:var(--loss); } .statusbar .warn{ color:var(--warn); }
.watermark{ margin-left:auto; color:var(--ink3); font-style:italic; }
h2.pg{ font-size:18px; font-weight:600; margin-bottom:4px; }
.pg-sub{ font-size:12.5px; color:var(--ink2); margin-bottom:18px; }
.cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; box-shadow:var(--shadow); }
.card .label{ font-size:11.5px; color:var(--ink2); letter-spacing:0.3px; }
.card .big{ font-family:'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC','Noto Serif SC',serif; font-size:27px; font-weight:600; margin-top:7px; font-variant-numeric:tabular-nums; letter-spacing:-0.4px; }
.card .big.sm{ font-size:21px; }
.card .delta{ font-size:12px; margin-top:5px; font-weight:600; }
.up{ color:var(--gain); } .down{ color:var(--loss); } .flat{ color:var(--ink2); }
.hero{ display:grid; grid-template-columns:1.5fr 1fr; gap:14px; margin-bottom:18px; }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px; box-shadow:var(--shadow); position:relative; }
.panel h3{ font-size:13px; font-weight:600; color:var(--ink2); letter-spacing:0.3px; margin-bottom:14px; }
.donut-wrap{ display:flex; align-items:center; gap:20px; }
.legend{ display:flex; flex-direction:column; gap:9px; flex:1; }
.lg{ display:flex; align-items:center; gap:8px; font-size:12.5px; cursor:pointer; background:transparent; border:0; font-family:inherit; padding:0; width:100%; text-align:left; }
.lg .sw{ width:10px; height:10px; border-radius:3px; flex:0 0 10px; }
.lg .nm{ flex:1; color:var(--ink2); }
.lg .val{ font-variant-numeric:tabular-nums; font-weight:600; color:var(--ink); }
.lg .pct{ color:var(--ink3); width:52px; text-align:right; font-variant-numeric:tabular-nums; }
.donut-pop{ position:absolute; left:118px; top:148px; transform:translate(-50%,-50%); background:var(--surface); border:1px solid var(--line); border-radius:9px; box-shadow:0 10px 34px rgba(0,0,0,0.22); padding:12px 14px; min-width:196px; z-index:10; display:none; font-size:12.5px; }
.donut-pop.open{ display:block; }
.poprow{ display:flex; justify-content:space-between; gap:16px; font-size:12px; color:var(--ink2); margin-top:6px; }
.poprow b{ font-variant-numeric:tabular-nums; color:var(--ink); font-weight:600; }
table.tbl{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.tbl th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink3); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; background:transparent; border-top:0; border-left:0; border-right:0; font-family:inherit; }
table.tbl th:hover{ color:var(--ink); }
table.tbl td{ padding:10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
table.tbl tr:hover td{ background:var(--hover); }
table.tbl tr{ cursor:pointer; }
.num{ font-family:ui-monospace,'SF Mono',Consolas,monospace; font-variant-numeric:tabular-nums; }
.pill{ display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.pill.buy{ background:rgba(23,102,63,0.10); color:var(--gain); }
body[data-theme="dark"] .pill.buy{ background:rgba(76,191,130,0.10); }
.pill.sell{ background:rgba(169,58,55,0.10); color:var(--loss); }
body[data-theme="dark"] .pill.sell{ background:rgba(224,120,115,0.10); }
.pill.dep{ background:rgba(23,102,63,0.10); color:var(--gain); }
.pill.wd{ background:rgba(169,58,55,0.10); color:var(--loss); }
.pill.rec{ background:rgba(138,100,22,0.10); color:var(--warn); }
body[data-theme="dark"] .pill.rec{ background:rgba(208,168,92,0.12); }
.pill.bad{ background:rgba(169,58,55,0.10); color:var(--loss); }
.pill.nodata{ background:rgba(104,113,106,0.14); color:var(--ink3); }
body[data-theme="dark"] .pill.nodata{ background:rgba(138,147,140,0.16); }
.tag-est{ font-size:10.5px; color:var(--warn); font-weight:600; }
.toolbar{ display:flex; gap:8px; margin-bottom:14px; align-items:center; flex-wrap:wrap; }
.search{ height:32px; border:1px solid var(--line); border-radius:7px; padding:0 11px; font-size:12.5px; background:var(--btn-ghost); color:var(--ink); font-family:inherit; min-width:180px; }
.select{ height:32px; border:1px solid var(--line); border-radius:7px; padding:0 9px; font-size:12.5px; background:var(--btn-ghost); color:var(--ink); font-family:inherit; }
.empty{ text-align:center; padding:48px 0; color:var(--ink3); }
.empty .ic{ font-size:32px; margin-bottom:8px; }
.modal-mask{ position:fixed; inset:0; background:rgba(20,24,22,0.4); display:none; align-items:center; justify-content:center; z-index:50; }
.modal-mask.open{ display:flex; }
.modal{ width:560px; max-width:92vw; max-height:86vh; overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 30px 90px rgba(0,0,0,0.35); }
.modal .mhead{ padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; }
.modal .mhead h3{ font-size:15px; font-weight:600; flex:1; }
.modal .mclose{ cursor:pointer; color:var(--ink3); font-size:20px; line-height:1; background:none; border:0; font-family:inherit; }
.modal .mclose:hover{ color:var(--ink); }
.modal .mbody{ padding:20px; }
.modal .mfoot{ padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; color:var(--ink2); margin-bottom:5px; }
.field .inp, .field .sel{ width:100%; height:34px; border:1px solid var(--line); border-radius:7px; padding:0 10px; font-size:13px; background:var(--btn-ghost); color:var(--ink); font-family:inherit; }
.field .inp.err{ border-color:var(--loss); }
.field .hint{ font-size:11px; color:var(--ink3); margin-top:4px; line-height:1.7; }
.field .err-msg{ font-size:11px; color:var(--loss); margin-top:4px; display:none; }
.field .err-msg.show{ display:block; }
.frow{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.totalline{ background:var(--surface2); border-radius:7px; padding:12px 14px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:baseline; }
.totalline .l{ font-size:12px; color:var(--ink2); }
.totalline .v{ font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
.settings-group{ margin-bottom:22px; }
.settings-group h3{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink3); margin-bottom:4px; }
.set-row{ display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); }
.set-row .lbl{ flex:1; }
.set-row .lbl .t{ font-size:13px; font-weight:500; }
.set-row .lbl .d{ font-size:11.5px; color:var(--ink3); margin-top:1px; }
.switch{ position:relative; width:38px; height:22px; background:var(--surface2); border-radius:11px; cursor:pointer; transition:background .15s; flex:0 0 38px; border:1px solid var(--line); font-family:inherit; padding:0; }
.switch::after{ content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,0.2); }
.switch.on{ background:var(--accent); } .switch.on::after{ left:18px; }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.seg button{ border:0; background:var(--btn-ghost); color:var(--ink2); font-size:12px; padding:6px 12px; cursor:pointer; font-family:inherit; }
.seg button.on{ background:var(--accent); color:var(--accent-ink); }
.menu{ position:absolute; background:var(--surface); border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow); min-width:180px; z-index:60; overflow:hidden; display:none; }
.menu.open{ display:block; }
.menu .mi{ padding:9px 14px; font-size:12.5px; cursor:pointer; display:block; width:100%; text-align:left; background:none; border:0; font-family:inherit; }
.menu .mi:hover{ background:var(--hover); }
.menu .mi.danger{ color:var(--loss); }
.acctwrap{ position:relative; }
.toast{ position:fixed; bottom:54px; right:28px; background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:8px; font-size:12.5px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:opacity .2s,transform .2s; z-index:100; pointer-events:none; max-width:420px; }
.toast.show{ opacity:1; transform:translateY(0); }
.pair-sug{ position:absolute; top:100%; left:0; right:0; background:var(--surface); border:1px solid var(--line); border-radius:7px; box-shadow:var(--shadow); max-height:180px; overflow:auto; z-index:20; display:none; margin-top:2px; }
.pair-sug.open{ display:block; }
.pair-sug .opt{ padding:8px 11px; font-size:12.5px; cursor:pointer; display:flex; justify-content:space-between; background:none; border:0; width:100%; font-family:inherit; text-align:left; }
.pair-sug .opt:hover{ background:var(--hover); }
.pair-sug .opt .dim{ color:var(--ink3); font-size:11px; }
.kbd{ font-family:ui-monospace,Consolas,monospace; font-size:10.5px; color:var(--ink3); border:1px solid var(--line); border-radius:4px; padding:0 4px; }
.gcard{ width:400px; max-width:94%; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:26px 28px; }
.gcard.wide{ width:660px; }
.gbrand{ text-align:center; margin-bottom:8px; }
.gbrand .glogo{ font-family:'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC','Noto Serif SC',serif; font-size:24px; font-weight:600; letter-spacing:-0.3px; color:var(--ink); }
.gbrand .gtag{ font-size:10.5px; color:var(--ink3); margin-top:3px; letter-spacing:0.4px; }
.gtitle{ font-size:16px; font-weight:600; text-align:center; margin-top:8px; }
.gsub{ font-size:12px; color:var(--ink2); text-align:center; margin:4px 0 18px; }
.glinks{ display:flex; justify-content:space-between; margin-top:16px; }
.glink{ background:none; border:0; color:var(--accent); font-size:12.5px; cursor:pointer; font-family:inherit; padding:4px 2px; }
.glink:hover{ text-decoration:underline; }
.demo-hint{ font-size:11px; color:var(--ink3); text-align:center; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
.riskbox{ background:var(--surface2); border:1px solid var(--line); border-radius:7px; padding:14px 16px; font-size:13px; line-height:1.9; color:var(--ink); }
.riskbox .rt{ font-size:11px; font-weight:700; color:var(--warn); letter-spacing:0.6px; margin-bottom:6px; }
.ckrow{ display:flex; align-items:center; gap:8px; margin-top:14px; font-size:13px; cursor:pointer; }
.ckrow input{ width:15px; height:15px; accent-color:var(--accent); }
.wgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.wopt{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; text-align:left; cursor:pointer; font-family:inherit; transition:border-color .12s, background .12s; }
.wopt:hover{ border-color:var(--accent); background:var(--hover); }
.wopt .wt{ font-size:13.5px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:8px; }
.wopt .wd{ font-size:11.5px; color:var(--ink2); margin-top:6px; line-height:1.6; }
.pw-meter{ display:flex; gap:4px; margin-top:6px; align-items:center; }
.pw-meter i{ height:4px; flex:1; border-radius:2px; background:var(--line); }
.pw-meter.s1 i:nth-child(1){ background:var(--loss); }
.pw-meter.s2 i:nth-child(-n+2){ background:var(--warn); }
.pw-meter.s3 i:nth-child(-n+3){ background:var(--gain); }
.pw-meter .tx{ font-size:11px; color:var(--ink2); width:34px; text-align:right; }
.sumbox{ background:var(--surface2); border:1px solid var(--line); border-radius:7px; padding:12px 14px; margin-bottom:14px; font-size:12px; color:var(--ink2); line-height:1.8; }
@media (max-width:1280px){ body{ padding:12px; } .window{ width:100%; height:94vh; } }
</style>
</head>
<body>
<div class="window gated" id="win">
  <div class="titlebar"><div class="tlights"><i></i><i></i><i></i></div><div class="tbtitle" id="tbtitle"><b>WuZhuFolio</b> · 本地加密资产账本 - 登录</div></div>
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="logo">WuZhuFolio</div><div class="tag">数据本地化 · 零遥测 · 开源 AGPL-3.0</div></div>
      <nav class="nav" id="nav"></nav>
      <div class="sidefoot"><div class="acctwrap"><button class="acct" id="acctBtn" type="button"><div class="ava" id="acctAva">A</div><div style="flex:1"><div class="nm" id="acctName">Alex</div><div class="sub">切换账户 / 登出</div></div></button><div class="menu" id="acctMenu"></div></div></div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="crumb" id="crumb">仪表盘</div>
        <div class="spacer"></div>

        <button class="btn ghost" id="refreshBtn" title="刷新行情" type="button">↻ 行情</button>
        <button class="btn primary" id="syncBtn" title="同步交易" type="button">⟳ 同步</button>
      </div>
      <div class="content" id="content"></div>
      <div class="statusbar" id="statusbar"></div>
    </div>
  </div>
  <div class="gate" id="gate"></div>
</div>
<div class="modal-mask" id="mask"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ============ 主题（单一真源 · 双主题内置档位，暗色随深化自动维护） ============ */
var THEME='light';
var SESSION=false;
var GATEVIEW='login';
document.documentElement.setAttribute('data-theme', THEME);
var themeBtn=document.getElementById('themeBtn');
function applyTheme(t){
  THEME=t;

/* ============ 全量重放引擎（F11：持仓/成本/已实现/资金指标全部推导，杜绝硬编码不自洽） ============ */
function replay(){
  var ev=[];
  FUNDS.forEach(function(f){ ev.push({t:f.t,f:f}); });
  TXS.forEach(function(x){ ev.push({t:x.t,x:x}); });
  ev.sort(function(a,b){ return a.t<b.t?-1:1; });
  var pos={}, dep=0, wd=0;
  function P(s){ if(!pos[s]) pos[s]={q:0,c:0}; return pos[s]; }
  function addCoin(s,q,c){ var p=P(s); p.q+=q; p.c+=c; }
  function takeCoin(s,q){ var p=P(s); var avg=p.q>0?p.c/p.q:0; p.q-=q; p.c-=avg*q; return avg; }
  ev.forEach(function(e){
    if(e.f){ var f=e.f;
      if(f.ty==='DEPOSIT'){ addCoin(f.s,f.q,f.q*f.px); dep+=f.q*f.px; }
      else { takeCoin(f.s,f.q); wd+=f.q*f.px; }
    } else { var x=e.x; var pr=x.pair.split('/'); var base=pr[0], quote=pr[1];
      var feeQ = x.fc===quote ? x.fee : x.fee*x.px; /* 非计价币种手续费按记录时行情折算（演示数据均为计价币种计费） */
      if(x.ty==='BUY'){
        takeCoin(quote, x.tot + (x.fc===quote?x.fee:0));
        addCoin(base, x.q - (x.fc===base?x.fee:0), x.tot + feeQ);
      } else {
        var avg=takeCoin(base, x.q);
        if(x.fc===base){ takeCoin(base, x.fee); }
        var qIn = x.tot - (x.fc===quote?x.fee:0);
        addCoin(quote, qIn, qIn);
        x.rz=(x.tot - feeQ) - x.q*avg; /* 卖出逐笔已实现盈亏（黄金用例 1：+4,915） */
      }
    }
  });
  var holdings=[], tv=0, cash=0, rz=0;
  Object.keys(pos).forEach(function(s){ var p=pos[s]; if(p.q<=1e-9){ return; }
    var px=PRICES[s], v=p.q*px; tv+=v; if(STABLES[s]) cash+=v;
    holdings.push({s:s,n:NAMES[s],q:p.q,avg:p.c/p.q,px:px,rz:0});
  });
  TXS.forEach(function(x){ if(x.ty==='SELL'&&x.rz!==null){ rz+=x.rz; var b=x.pair.split('/')[0]; holdings.forEach(function(h2){ if(h2.s===b) h2.rz+=x.rz; }); } });
  holdings.sort(function(a,b){ return b.q*b.px - a.q*a.px; });
  var pnl24=0, base24=0;
  holdings.forEach(function(h2){ pnl24+=h2.q*(PRICES[h2.s]-PRICES24[h2.s]); base24+=h2.q*PRICES24[h2.s]; });
  return {holdings:holdings,tv:tv,cash:cash,rz:rz,dep:dep,wd:wd,net:dep-wd,totalRet:tv+wd-dep,
          roi:dep?(tv+wd-dep)/dep*100:null,pnl24:pnl24,pnl24pct:base24?pnl24/base24*100:null};
}

function pwScore(v){
  if(!v) return 0;
  var s=0;
  if(v.length>=8&&/[a-zA-Z]/.test(v)&&/\d/.test(v)) s=1;
  if(v.length>=10&&/[a-zA-Z]/.test(v)&&/\d/.test(v)&&/[^a-zA-Z0-9]/.test(v)) s=2;
  if(v.length>=12&&/[A-Z]/.test(v)&&/[a-z]/.test(v)&&/\d/.test(v)&&/[^a-zA-Z0-9]/.test(v)) s=3;
  return s;
}

  document.getElementById('win').classList.add('gated');
  var gate=document.getElementById('gate');
  gate.innerHTML = view==='login'?gateLogin():(view==='create'?gateCreate():(view==='wizard'?gateWizard():gateForgot()));
  if(view==='login'){
    var pw=document.getElementById('lgPw');
    pw.addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
    pw.focus();
    updateTb('登录');
  } else if(view==='create'){
    var pwEl=document.getElementById('cuPw');
    pwEl.addEventListener('input',updStrength);
    pwEl.addEventListener('keydown',function(e){ if(e.key==='Enter') doCreate(); });
    updateTb('创建账户');
  } else if(view==='wizard'){ updateTb('初始化向导'); }
  else { updateTb('忘记密码'); }
}
function enterShell(page){
  SESSION=true;
  document.getElementById('win').classList.remove('gated');
  document.getElementById('gate').innerHTML='';
  if(page){ go(page); } else { updateTb(); }
}

var COIN_S=null;
function coinTxRow(t){ var pill=t.ty==='BUY'?'buy':'sell';
  return '<tr><td>'+t.pair+'</td><td><span class="pill '+pill+'">'+(t.ty==='BUY'?'买入':'卖出')+'</span></td><td class="num">'+usd(t.px)+'</td><td class="num">'+qty(t.q)+'</td><td class="num">'+qty(t.fee)+' '+t.fc+'</td><td>'+t.ex+'</td><td class="num">'+t.t+'</td><td class="num">'+(t.rz!==null&&t.rz!==undefined?'<span class="up">+'+usd(t.rz)+'</span>':'-')+'</td></tr>';
}
function coinTxFilter(){
  var ex=document.getElementById('cex'), ty=document.getElementById('cty'), q=document.getElementById('cq');
  var txs=TXS.filter(function(t){ return t.pair.indexOf(COIN_S+'/')===0; });
  if(ex&&ex.value!=='全部交易所'){ txs=txs.filter(function(t){ return t.ex===ex.value; }); }
  if(ty&&ty.value!=='全部类型'){ txs=txs.filter(function(t){ return ty.value==='买入'?t.ty==='BUY':t.ty==='SELL'; }); }
  if(q&&q.value){ var v=q.value.toLowerCase(); txs=txs.filter(function(t){ return t.t.toLowerCase().indexOf(v)>=0||(t.note||'').toLowerCase().indexOf(v)>=0; }); }
  var b=document.getElementById('coinTxBody'); if(b){ b.innerHTML=txs.length?txs.map(coinTxRow).join(''):'<tr><td colspan="8"><div class="empty" style="padding:18px 0">暂无符合条件的记录</div></td></tr>'; }
}
function openCoin(s){

  var v=h0.q*h0.px; var u=(h0.px-h0.avg)*h0.q; var up=h0.px>=h0.avg; var upc=h0.avg?(h0.px-h0.avg)/h0.avg*100:0;
  var h='<div class="modal" style="width:680px"><div class="mhead"><h3>'+h0.s+' · '+h0.n+'</h3><button class="mclose" aria-label="关闭" type="button" onclick="closeModal()">×</button></div><div class="mbody">';
  h+='<div class="cards" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">';
  h+=card('持有数量', qty(h0.q), '', 'flat', true);
  h+=card('当前持有价值', usd(v), '占总资产 '+nf(v/m.tv*100,1)+'%', 'flat', true);
  h+=card('总浮动盈亏', (up?'+':'')+usd(u)+' ('+pct(upc)+')', '平均成本 '+usd(h0.avg), up?'up':'down', true);
  h+=card('累计已实现盈亏', (h0.rz>=0?'+':'')+usd(h0.rz), '卖出逐笔累计', h0.rz>=0?'up':'down', true);
  h+='</div>';
  h+='<div class="toolbar"><button class="btn primary sm" type="button" onclick="toast(\'已以 Binance 余额校准持仓（单一数据来源）\')">以交易所余额校准持仓</button><span class="tag-est" style="margin-left:auto">单一数据来源 · Binance</span></div>';
  h+='<div class="toolbar" style="margin-bottom:8px"><select class="select" id="cex" aria-label="按交易所筛选" onchange="coinTxFilter()"><option>全部交易所</option><option>Binance</option></select><select class="select" id="cty" aria-label="按类型筛选" onchange="coinTxFilter()"><option>全部类型</option><option>买入</option><option>卖出</option></select><input class="search" id="cq" style="min-width:150px" placeholder="搜索时间 / 备注" aria-label="搜索交易记录" oninput="coinTxFilter()"></div>';
  var txs=TXS.filter(function(t){ return t.pair.indexOf(h0.s+'/')===0; });
  h+='<table class="tbl"><thead><tr><th style="cursor:default">交易对</th><th style="cursor:default">类型</th><th style="cursor:default">价格</th><th style="cursor:default">数量</th><th style="cursor:default">手续费</th><th style="cursor:default">交易所</th><th style="cursor:default">时间</th><th style="cursor:default">已实现盈亏</th></tr></thead><tbody id="coinTxBody">'+txs.map(coinTxRow).join('')+'</tbody></table>';

  h+='</div><div class="mfoot"><button class="btn ghost" type="button" onclick="closeModal()">关闭</button></div></div>';
  openModal(h);
}

function testApi(){ toast('测试请求通过 · 已用该密钥获取账户信息（只读）'); }
function saveApi(){
  var alias=(document.getElementById('apiAlias').value||'新 API').trim();
  APIS.push({alias:alias,ex:'Binance',key:'••••••••••••'+Math.random().toString(16).slice(2,6).toUpperCase(),last:'刚刚',st:'OK'});
  closeModal(); if(cur==='settings'){ renderPage(); }
  toast('密钥已加密保存 · 请清理系统剪贴板 · 立即执行首次同步（增量去重）…');
}
function openBackup(){
  var h='<div class="modal"><div class="mhead"><h3>数据管理</h3><button class="mclose" aria-label="关闭" type="button" onclick="closeModal()">×</button></div><div class="mbody">';
  h+='<div class="settings-group"><h3>备份</h3><div class="set-row"><div class="lbl"><div class="t">备份当前账户数据</div><div class="d">.cpro = 明文头部 + AES-256-GCM 加密载荷 · 不含账户信息</div></div><button class="btn primary sm" type="button" onclick="toast(\'请设置备份文件密码（默认填当前账户密码）\')">备份数据</button></div><div class="set-row"><div class="lbl"><div class="t">上次备份时间</div><div class="d">2026-08-26 22:10</div></div></div></div>';

  h+='</div><div class="mfoot"><button class="btn ghost" type="button" onclick="closeModal()">关闭</button></div></div>';

}
function openRestoreWizard(){
  var h='<div class="modal" style="width:480px"><div class="mhead"><h3>从备份恢复（.cpro）</h3><button class="mclose" aria-label="关闭" type="button" onclick="closeModal()">×</button></div><div class="mbody">';
  h+='<div class="field"><label for="rvAcct">目标账户（恢复前已创建 / 选定）</label><input class="inp" id="rvAcct" type="text" value="'+esc(currentAcct())+'" readonly><div class="hint">全新安装时先创建（或选定）目标账户，再从备份恢复，导入数据归入该账户（PRD 5.2-8 / 流程图 1）</div></div>';

  h+='<div class="field"><label for="rvPw">备份文件密码</label><input class="inp" id="rvPw" type="password" placeholder="••••••••"><div class="hint">独立于当前账户密码（默认填当前账户密码，可修改）· 跨设备/跨账户恢复只依赖该密码</div></div>';
  h+='<div class="field"><label>导入方式</label><div class="seg"><button type="button" class="on" onclick="segPick(this)">增量合并（默认）</button><button type="button" onclick="segPick(this)">全量覆盖</button></div><div class="hint">增量合并：uuid / 交易所+订单号 / 模糊匹配三级去重；全量覆盖：二次确认 + 覆盖前自动生成临时备份（全局行情缓存保留）</div></div>';
  h+='</div><div class="mfoot"><button class="btn ghost" type="button" onclick="closeModal()">取消</button><button class="btn primary" type="button" onclick="doRestore()">开始恢复</button></div></div>';
  openModal(h);
}
function doRestore(){ closeModal(); toast('恢复完成 · 已触发持仓与指标的全量重放重算并刷新全部页面'); }
function openLogs(){
  var h='<div class="modal" style="width:560px"><div class="mhead"><h3>日志（已脱敏）</h3><button class="mclose" aria-label="关闭" type="button" onclick="closeModal()">×</button></div><div class="mbody">';
  h+='<table class="tbl"><thead><tr><th style="cursor:default">时间</th><th style="cursor:default">操作</th><th style="cursor:default">结果</th></tr></thead><tbody>';
  h+='<tr><td class="num">2026-08-30 09:41:02</td><td>行情刷新 · CoinGecko 批量当前价（6 币种）</td><td><span class="pill dep">成功 · 快照 +6</span></td></tr>';
  h+='<tr><td class="num">2026-08-30 09:41:05</td><td>交易同步 · Binance · 账户 A***</td><td><span class="pill dep">成功 · 新成交 2 · 去重跳过 1</span></td></tr>';
  h+='<tr><td class="num">2026-08-30 09:43:11</td><td>行情刷新 · CoinGecko 公共 API</td><td><span class="pill rec">429 · 已退避 32s（第 1 次）</span></td></tr>';
  h+='<tr><td class="num">2026-08-30 10:12:40</td><td>备份导出 · wuzhufolio-20260826.cpro</td><td><span class="pill dep">成功 · 记录 8 条</span></td></tr>';
  h+='<tr><td class="num">2026-08-30 10:15:02</td><td>登录 · 账户 A***（记住我）</td><td><span class="pill dep">成功</span></td></tr>';
  h+='</tbody></table>';
  h+='<div class="hint" style="margin-top:12px">轮转：本地日志与 sync_logs 各保留最近 1 万条或 90 天（先到为准），超出自动清理。密钥明文/哈希与完整响应体不落日志；账户名与金额默认脱敏（部分遮蔽）。</div>';
  h+='</div><div class="mfoot"><button class="btn ghost" type="button" onclick="toast(\'导出前请检查是否包含敏感信息（已自动脱敏）\')">导出日志</button><button class="btn ghost" type="button" onclick="closeModal()">关闭</button></div></div>';
  openModal(h);
}
function openCgKey(){
  var cfg=MARKET_CG.configured;
  var h='<div class="modal" style="width:460px"><div class="mhead"><h3>行情数据源 · CoinGecko API Key</h3><button class="mclose" aria-label="关闭" type="button" onclick="closeModal()">×</button></div><div class="mbody">';
  if(cfg){ h+='<p style="font-size:12.5px;color:var(--ink2);line-height:1.8">当前已配置个人 Key（专属额度约 30 次/分钟、1 万次/月；月度额度达 80% 自动降一档并在状态栏提示）。</p>'; }
  else { h+='<div class="field"><label for="cgKey">API Key</label><input class="inp" id="cgKey" type="password" placeholder="CG-xxxxxxxxxxxxxxxx" autocomplete="off"></div><div class="hint" style="font-size:11.5px;color:var(--ink3);line-height:1.8">不填 = 使用无 Key 公共 API（开箱即用，按 IP 共享限流约 30 次/分钟，429 频发建议注册个人 Key）。<br>免费注册：coingecko.com/api/pricing（浏览器打开）。密钥仅存本地、不上传。</div>'; }
  h+='</div><div class="mfoot">'+(cfg?'<button class="btn danger" type="button" onclick="removeCgKey()">移除 Key</button>':'')+'<button class="btn ghost" type="button" onclick="closeModal()">取消</button>'+(cfg?'':'<button class="btn primary" type="button" onclick="saveCgKey()">保存并切换专属额度</button>')+'</div></div>';
  openModal(h);
}
function saveCgKey(){ var v=document.getElementById('cgKey').value.trim(); if(!v){ toast('未填写 Key · 保持无 Key 公共 API'); closeModal(); return; } MARKET_CG.configured=true; MARKET_CG.key=v; closeModal(); document.getElementById('srcText').textContent='CoinGecko · 专属额度'; toast('已切换 CoinGecko 专属额度（约 30 次/分钟、1 万次/月）'); renderPage(); renderStatus(); }
function removeCgKey(){ MARKET_CG.configured=false; MARKET_CG.key=''; closeModal(); document.getElementById('srcText').textContent='CoinGecko · 无 Key 公共 API'; toast('已切换回无 Key 公共 API'); renderPage(); renderStatus(); }
function openCmcKey(){
  var cfg=MARKET_CMC.configured;
  var h='<div class="modal" style="width:460px"><div class="mhead"><h3>行情兜底 · CoinMarketCap API Key</h3><button class="mclose" aria-label="关闭" type="button" onclick="closeModal()">×</button></div><div class="mbody">';
  if(cfg){ h+='<p style="font-size:12.5px;color:var(--ink2);line-height:1.8">已配置兜底 Key：主源 CoinGecko 失败（网络/超时/429/额度耗尽/币种未收录）时，按 CMC id 批量查询 quotes/latest 兜底，价格旁标注「数据源：CoinMarketCap」，主源恢复自动回落。</p>'; }
  else { h+='<div class="field"><label for="cmcKey">API Key</label><input class="inp" id="cmcKey" type="password" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off"></div><div class="hint" style="font-size:11.5px;color:var(--ink3);line-height:1.8">可选 · 不填 = 无兜底，主源失败时保持上次价格并显示上次成功时间戳。<br>免费注册：coinmarketcap.com/api（浏览器打开）。密钥仅存本地、不上传。</div>'; }
  h+='</div><div class="mfoot">'+(cfg?'<button class="btn danger" type="button" onclick="removeCmcKey()">移除 Key</button>':'')+'<button class="btn ghost" type="button" onclick="closeModal()">取消</button>'+(cfg?'':'<button class="btn primary" type="button" onclick="saveCmcKey()">保存</button>')+'</div></div>';
  openModal(h);
}
function saveCmcKey(){ var v=document.getElementById('cmcKey').value.trim(); if(!v){ toast('未填写 Key · 无兜底'); closeModal(); return; } MARKET_CMC.configured=true; MARKET_CMC.key=v; closeModal(); toast('已配置 CoinMarketCap 兜底'); renderPage(); renderStatus(); }
function removeCmcKey(){ MARKET_CMC.configured=false; MARKET_CMC.key=''; closeModal(); toast('已移除 CoinMarketCap 兜底'); renderPage(); renderStatus(); }

/* ============ 顶栏动作 / 分段控件 ============ */
document.getElementById('refreshBtn').addEventListener('click',function(){ var b=document.getElementById('srcBadge'); b.className='badge'; document.getElementById('srcText').textContent=(MARKET_CG.configured?'CoinGecko · 专属额度':'CoinGecko · 无 Key 公共 API')+' · 已更新 '+new Date().toTimeString().slice(0,5); toast(MARKET_CG.configured?'行情已刷新（CoinGecko 专属额度）':'行情已刷新（CoinGecko 无 Key 公共 API）'); });
document.getElementById('syncBtn').addEventListener('click',function(){ toast('交易同步中（Binance 只读 · 增量去重）…'); });
function segPick(btn){ var seg=btn.parentElement; var bs=seg.querySelectorAll('button'); bs.forEach(function(b){ b.classList.remove('on'); }); btn.classList.add('on'); }
function segPickTheme(btn,t){ segPick(btn); applyTheme(t); }

/* ============ 初始化 ============ */
applyTheme(THEME); renderNav(); renderPage(); renderStatus(); renderAcctMenu(); showGate('login');
</script>
