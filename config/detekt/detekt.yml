# detekt 配置（在默认规则之上微调，T0.2/T0.6）
# 口径：Compose 声明式代码 + design token 常量文件的噪声规则停用；其余默认规则全开（maxIssues=0 严格模式）。
build:
  maxIssues: 0

naming:
  active: true
  FunctionNaming:
    # Compose 的 @Composable 函数按大驼峰命名（官方惯例）
    ignoreAnnotated: [ 'Composable' ]
  TopLevelPropertyNaming:
    ignoreAnnotated: [ 'Composable' ]
  MatchingDeclarationName:
    # Kotlin 惯例允许同文件归组相关小声明（如 WzColors + lightWzColors/darkWzColors）
    active: false

style:
  active: true
  MagicNumber:
    # design token 色值/尺寸/延时为声明式字面量（design-tokens.md 单源映射），命名常量反而割裂单源
    active: false
  MaxLineLength:
    # i18n 目录为 zh/en 文案表：单条文案是完整句子，换行会破坏文案本身与全文检索（M12 T12.4）。
    # 注意：显式写 excludes 会**覆盖** detekt 默认的测试目录排除，故此处必须显式带回默认测试排除。
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/i18n/**']
  UnusedPrivateMember:
    ignoreAnnotated: [ 'Preview', 'Composable' ]

complexity:
  active: true
  CyclomaticComplexMethod:
    # Compose 组件的 when 分支随变体自然增长，以小组件拆分约束而非圈复杂度
    ignoreAnnotated: [ 'Composable' ]
  LongMethod:
    # Compose 声明式 UI 以嵌套表达，行数不反映逻辑复杂度；以小组件拆分约束
    ignoreAnnotated: [ 'Composable' ]
  LongParameterList:
    # Compose 组件参数列表普遍较长，以默认值+Modifier 惯例约束
    ignoreAnnotated: [ 'Composable' ]
  TooManyFunctions:
    # i18n 目录为文案表（接口 + zh/en 两实现，词条数天然超过函数数阈值），非逻辑复杂度（M12 T12.4）。
    # 同理必须显式带回默认测试排除，否则测试类（每个用例一个函数）会被误判。
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/i18n/**']

exceptions:
  active: true
  TooGenericExceptionCaught:
    # 迁移框架边界必须 catch Exception 以保证回滚（Migrator.apply），其余代码仍应捕具体异常
    active: false

comments:
  active: true
  AbsentOrWrongFileLicense:
    active: false
